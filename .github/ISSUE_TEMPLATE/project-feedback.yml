name: Project feedback
description: Ask a question, suggest a reporting improvement, or correct the showcase documentation.
title: "[Feedback] "
body:
  - type: markdown
    attributes:
      value: |
        This repository is a documentation showcase of a private automation.
        Do not include tokens, account IDs, private report links, workflow exports, backups, contact data, or unredacted logs.
        Follow SECURITY.md for suspected exposures.
  - type: dropdown
    id: category
    attributes:
      label: Feedback type
      options:
        - Documentation correction
        - Project question
        - Reporting suggestion
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Reference the relevant guide and describe the question or suggested change using non-sensitive information.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before posting
      options:
        - label: I have removed private access information, account data, report links, and logs.
          required: true
